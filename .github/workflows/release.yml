# .github/release.yml

name: Release on npm
on:
  workflow_dispatch: {}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          yarn install

      - name: Build
        run: |
          yarn clean
          yarn build
          cp logo.svg deno/lib
          cp README.md deno/lib

      - name: Pack
        run: |
          npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: zod-tgz
          path: zod-*.tgz
          if-no-files-found: error
